# Our assumptions: where the data allows more than one reading, the rule we chose and why.
#
# Each rule can be turned off with `applies: false`. `status` says where the rule stands: `decided`
# when it is our call and the evidence is strong enough to hold it without an answer, `open` when it
# needs Corvane's answer, `confirmed` when Corvane confirmed it. `exceptions` lists the keys of single
# cases where the opposite of the rule holds.

parameters:
  # An invoice is atypical when its service line is not one of these, it is at least this amount, and
  # it is at least this many times what the customer bills in an average month. Totals are shown with
  # and without atypical invoices, so a one-off project does not hide or fake a trend. Inspection and
  # monitoring are billed on a schedule, so a large one is a large customer, not a one-off.
  atypicalInvoiceExcludedLines: [Inspection & Testing, Monitoring]
  atypicalInvoiceMinimum: 100000
  atypicalInvoiceMultiple: 1.5
  # A customer with no invoice in this many days has stopped billing. Customers are billed almost
  # every month, so 90 days without one is a clear signal.
  stoppedBillingDays: 90
  # A contract billed in the last 12 months below or above these shares of its annual value is
  # listed for Corvane to check: unbilled work or an unrecorded cancellation below, work beyond the
  # contract above. Customers usually bill close to their contract value.
  underBilledContractShare: 0.5
  overBilledContractShare: 1.5
  # A customer's billing declines when its last complete half, without atypical invoices, is below the
  # same half a year earlier by at least this amount and one of these shares: moderate, strong or very
  # strong. The amount keeps a small customer's swing from reading as a decline.
  minimumDeclineAmount: 10000
  moderateDeclineShare: 0.1
  strongDeclineShare: 0.25
  veryStrongDeclineShare: 0.5
  # The worklist acts now on a customer at medium risk whose contract ends within this many days, and
  # lists as a renewal a contract ending within the second number. Both count contracts already ended.
  actNowRenewalDays: 90
  upcomingRenewalDays: 180
  # A customer that stopped billing within this many months is still worth winning back.
  winBackMonths: 12

duplicateCustomers:
  # CRM records with the same normalized name in the same city and state are one customer. Records
  # that share a name but not the location are kept apart as possible duplicates. Case key: the CRM
  # ids joined by "+", e.g. "C-0293+C-0796".
  applies: true
  status: decided
  basis: >-
    The names only differ in case, punctuation or a legal suffix, the city and state match, and
    NetSuite bills both ids.

shortenedNoteNames:
  # A note name of two or more words is linked when exactly one customer's name starts with those
  # words ("Kessler Surgical"). Case key: the name as written in the notes.
  applies: true
  status: decided
  basis: >-
    The shortened name has at least two words and matches the start of exactly one customer's name.

duplicateInvoices:
  # An invoice row identical in every column to an earlier one, invoice number included, is an
  # export error and does not count. Case key: the invoice, e.g. "netsuite:NS-INV-51227".
  applies: true
  status: decided
  basis: >-
    A second charge would have its own invoice number. The copies carry the same number as the
    original and sit on the line right after it.

voidedInvoices:
  # A voided invoice was cancelled and does not count. Case key: the invoice.
  applies: true
  status: decided
  basis: The billing system marks it as void.

creditMemos:
  # A credit memo (a negative amount) reduces billing in the month it is issued, since it does not
  # say which invoice it corrects. Case key: the invoice.
  applies: true
  status: decided
  basis: Billing is reported net of credits. The exports do not link a credit to the invoice it corrects.

impossibleContractDates:
  # A contract that ends before it starts has an unreliable end date, taken as unknown. Turned off,
  # the end date is taken as exported and the contract looks expired. Case key: the contract id.
  applies: true
  status: open
  basis: >-
    The end falls one or more years before the start, which looks like a mistyped year. The right
    year cannot be told from the data. Asked Corvane.

# Links no rule can make, decided by a person: a QuickBooks or note name to a customer id, or a
# NetSuite id missing from the CRM to a CRM customer. Each entry has `source`, `value`, `customer`,
# `confirmed` and `evidence`.
assignments: []
